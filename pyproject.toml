[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-market-intelligence-bot"
version = "0.1.0"
description = "Research-first Binance Spot market scanner with explainable technical signals and risk levels."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "luciferalive"}]
dependencies = [
  "ccxt>=4.4.0,<5.0.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.8,<1.0"]

[project.scripts]
marketbot = "marketbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
